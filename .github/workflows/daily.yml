name: Daily publish

# Nightly build-and-release. This workflow NEVER touches main directly and
# NEVER auto-publishes: it runs the full pipeline, promotes via `aiv release`
# on a release/<date>-issue-<N> branch, and opens a PR. Merging that PR is
# the ratification, and — because Pages serves docs/ from main — the publish.
#
# Contract notes (docs/internal/DESIGN.md):
# - Canonical = data/released/ on main. The issue number assigned here is a
#   proposal; it becomes a commitment at merge. A closed PR burns nothing.
# - At most one release/ PR may be open at a time (numbering uniqueness).
# - --force is permitted ONLY as the staging-integrity fallback below
#   (ratified 2026-08-04): the failure surfaces at the top of the PR body
#   and the merge stays human. A forced release must never auto-merge.
#   --revise is never passed on an unattended run.

on:
  schedule:
    # 21:00 UTC = 07:00 Sydney (AEST); 08:00 during daylight saving. The
    # issue date is computed from Sydney wall-clock below, never from the
    # runner's UTC clock, so only the wake-up hour drifts seasonally.
    #
    # Days 0-4 (Sun-Thu in UTC) = Monday-Friday mornings in Sydney: the
    # newsletter publishes weekdays only. Monday's issue absorbs the weekend
    # via the gap-aware fetch window in src/fetch.py, which widens each
    # source's recency window by the days elapsed since the last release.
    - cron: "0 21 * * 0-4"
  workflow_dispatch:
    inputs:
      date:
        description: >
          Issue date, YYYY-MM-DD (Sydney calendar date). Blank = today in
          Sydney. Use for manual or backfill runs.
        required: false
        type: string

permissions:
  contents: write # push the release branch
  pull-requests: write # open the release PR
  issues: write # failure-notification issue

# One release pipeline at a time; a second trigger queues, never preempts a
# run that may be mid-promote or mid-push.
concurrency:
  group: daily-release-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      # Shadow/live switch for the revise loop inside `aiv run` (src/run.py
      # `_maybe_revise`, src/revise.py). Unset, or anything other than
      # "live"/"off", is shadow: proposals are written to revisions.jsonl and
      # nothing is applied. "live" makes the nightly run apply the reviewer's
      # text_edit fixes to the staged draft BEFORE release -- up to two
      # cycles of revise -> re-verify touched stories -> render -> review,
      # stopping when the computed verdict stops improving -- so the PR
      # carries the revised draft and a review of that draft. Either way the
      # merge stays human. Flipping the repo variable moves the whole fleet;
      # no workflow edit needed. The /revise PR command is independent of
      # this variable (it always runs live).
      AIV_REVISE_MODE: ${{ vars.AIV_REVISE_MODE }}

    steps:
      # Hard requirement: two open release PRs would both derive the same
      # issue number from main. Applies to ALL triggers — close or merge the
      # open PR first, then re-run.
      - name: Abort if a release PR is already open
        run: |
          open_pr=$(gh pr list --repo "${{ github.repository }}" --state open \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/"))][0].number // empty')
          if [ -n "$open_pr" ]; then
            echo "::error::Release PR #$open_pr is still open. Merge or close it before running (issue-number uniqueness)."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve issue date (Sydney calendar date)
        id: when
        run: |
          input_date="${{ github.event.inputs.date }}"
          if [ -n "$input_date" ]; then
            echo "date=$input_date" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ='Australia/Sydney' date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Two revision-pinned local models (embeddings + near-dedup verifier),
      # ~900MB combined. Keyed on src/cluster.py, which carries both pins.
      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          # v2: the v1 key was saved by a run that failed before the models
          # downloaded, permanently caching an empty dir under that key.
          key: hf-models-v2-${{ runner.os }}-${{ hashFiles('src/cluster.py') }}
          restore-keys: |
            hf-models-v2-${{ runner.os }}-

      # Stopgap for cross-time dedup: centroid .npz sidecars are gitignored
      # (rebuildable), so a fresh checkout has none and clustering runs
      # cross-time-blind. The cache carries them run-to-run; the PR body
      # reports visibility so a cache miss is never silent. Proper fix
      # (rebuild from tracked files) is tracked with the retrieval-engineer.
      - name: Cache released centroids
        uses: actions/cache@v6
        with:
          path: data/released/*/embeddings
          key: released-embeddings-${{ github.run_id }}
          restore-keys: |
            released-embeddings-

      - name: Install dependencies
        run: pip install -e . -c constraints.txt

      # Preflight refuses to run without the models already on disk (its
      # guard against surprise mid-pipeline downloads). On a cache hit this
      # is a no-op; on a cold cache it fronts the one-time ~880MB download.
      - name: Warm embedding models
        run: |
          python - <<'PY'
          from sentence_transformers import CrossEncoder, SentenceTransformer

          from src.cluster import (
              EMBEDDING_MODEL_NAME,
              EMBEDDING_MODEL_REVISION,
              VERIFIER_MODEL_NAME,
              VERIFIER_MODEL_REVISION,
          )

          SentenceTransformer(EMBEDDING_MODEL_NAME, revision=EMBEDDING_MODEL_REVISION)
          CrossEncoder(VERIFIER_MODEL_NAME, revision=VERIFIER_MODEL_REVISION)
          PY

      - name: Run staging pipeline
        run: aiv run --date "${{ steps.when.outputs.date }}"

      # Unattended-publish gate, SHADOW phase only (rollout phase comes from
      # the AIV_AUTO_PUBLISH_PHASE repo variable; unset = shadow). `aiv gate`
      # reads staging review.md/verify.json/issue.json and writes
      # data/staging/<date>/gate.json -- purely for observation this phase.
      # It never affects whether the PR opens or whether it merges: no
      # auto-merge logic exists yet. By contract `aiv gate` always exits 0
      # (the decision lives in gate.json, not the exit code); the `if`
      # below is belt-and-braces for the case where the gate itself crashes
      # before it can honour that contract, and it must never fail this job.
      - name: Publish gate (shadow -- observation only, never blocks)
        env:
          AIV_AUTO_PUBLISH_PHASE: ${{ vars.AIV_AUTO_PUBLISH_PHASE }}
        run: |
          DATE="${{ steps.when.outputs.date }}"
          if aiv gate --date "$DATE" > gate_output.txt; then
            :
          else
            echo "gate crashed — treat as hold" >> gate_output.txt
          fi
          cat gate_output.txt

      # If the pipeline wrote revisions.jsonl (shadow: proposals; live: what
      # was applied/rejected), render the PR-comment body now while staging
      # is still on disk. Posted later (see "Post revisions comment on PR")
      # once the PR exists. The renderer lives in src/revise.py next to the
      # writer of that file, so the two cannot drift apart again (the
      # inline reader this replaced rendered every line as a `?` row).
      - name: Build revisions comment
        id: revisions
        env:
          DATE: ${{ steps.when.outputs.date }}
        run: |
          if python -m src.revise --render-comment --date "$DATE" > revisions_comment.md; then
            echo "has_comment=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_comment=false" >> "$GITHUB_OUTPUT"
            echo "no revisions to report for $DATE (revisions.jsonl absent or empty)"
          fi

      # Direction ratified 2026-08-04: a staging-integrity failure (thin
      # issue) does NOT kill the run. The release is retried with --force,
      # the failed checks are surfaced at the TOP of the PR body, and the
      # merge/close call is the operator's. Safe because the PR merge is
      # still the publish gate; a forced release must NEVER auto-merge in
      # any future phase (see DESIGN.md, Unattended publish).
      - name: Release (promote staging to canonical on this runner)
        id: release
        run: |
          DATE="${{ steps.when.outputs.date }}"
          if aiv release --date "$DATE" > release_output.txt 2>&1; then
            cat release_output.txt
            echo "forced=false" >> "$GITHUB_OUTPUT"
          else
            cat release_output.txt
            grep -E "^\s+- " release_output.txt > integrity_failures.txt || true
            echo "Integrity check failed -- retrying with --force so the PR carries the decision."
            aiv release --date "$DATE" --force
            echo "forced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive issue number and branch name
        id: ids
        run: |
          DATE="${{ steps.when.outputs.date }}"
          ISSUE_NUM=$(python -c "import json; print(json.load(open('data/released/${DATE}/issue.json'))['issue_number'])")
          echo "issue_num=$ISSUE_NUM" >> "$GITHUB_OUTPUT"
          echo "branch=release/${DATE}-issue-${ISSUE_NUM}" >> "$GITHUB_OUTPUT"

      - name: Build PR body
        env:
          DATE: ${{ steps.when.outputs.date }}
          ISSUE_NUM: ${{ steps.ids.outputs.issue_num }}
          RELEASE_FORCED: ${{ steps.release.outputs.forced }}
        run: |
          python <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          date = os.environ["DATE"]
          issue_num = os.environ["ISSUE_NUM"]

          issue = json.loads(Path(f"data/released/{date}/issue.json").read_text())
          sections = issue.get("sections") or []
          section_counts = ", ".join(
              f"{s.get('name', '?')}={len(s.get('stories') or [])}" for s in sections
          )
          pulse_count = len((issue.get("pulse") or {}).get("stories") or [])

          verify_line = "verify: not available"
          verify_path = Path(f"data/released/{date}/verify.json")
          if verify_path.exists():
              try:
                  v = json.loads(verify_path.read_text())
                  verify_line = f"verify: {v.get('verdict', '?')} ({v.get('verdict_counts', {})})"
              except Exception:
                  verify_line = "verify: unreadable"

          review_line = "review: not available"
          review_path = Path(f"data/staging/{date}/review.md")
          if review_path.exists():
              try:
                  import yaml
                  raw = review_path.read_text()
                  if raw.startswith("---"):
                      fm = yaml.safe_load(raw[3 : raw.index("---", 3)])
                      review_line = (
                          f"review: {fm.get('verdict', '?')} — {fm.get('one_line', '')} "
                          "(full editor's review in the PR comment below)"
                      )
              except Exception:
                  review_line = "review: unreadable"

          # Cross-time dedup visibility: which prior released issues in the
          # 14-day window had centroids on this runner when clustering ran.
          run_day = dt.date.fromisoformat(date)
          window = []
          for p in sorted(Path("data/released").iterdir()):
              try:
                  d = dt.date.fromisoformat(p.name)
              except ValueError:
                  continue
              if dt.timedelta(0) < run_day - d <= dt.timedelta(days=14):
                  window.append(p)
          visible = sum(1 for p in window if (p / "embeddings" / "centroids.npz").exists())
          if not window:
              dedup_line = "cross-time dedup: no released issues in the 14-day window."
          elif visible == len(window):
              dedup_line = f"cross-time dedup: fully sighted ({visible}/{len(window)} prior issues had centroids)."
          else:
              dedup_line = (
                  f"⚠️ cross-time dedup ran PARTIALLY BLIND: {visible}/{len(window)} prior "
                  "issues had centroids on the runner. Continuation stories may appear "
                  "fresh or uncapped — review with extra care."
              )

          gate_lines = ["(gate step did not run or produced no output)"]
          gate_output_path = Path("gate_output.txt")
          if gate_output_path.exists():
              text = gate_output_path.read_text().strip("\n")
              if text:
                  gate_lines = text.splitlines()

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          preview = (
              f"https://raw.githack.com/{repo}/release/{date}-issue-{issue_num}"
              f"/docs/released/{date}.html"
          )
          forced_block = []
          if os.environ.get("RELEASE_FORCED") == "true":
              failures = "no detail captured"
              fpath = Path("integrity_failures.txt")
              if fpath.exists() and fpath.read_text().strip():
                  failures = fpath.read_text().strip()
              forced_block = [
                  "## ⚠️ FORCED RELEASE — integrity check failed",
                  "",
                  "The staging-integrity gate refused this draft; it was",
                  "force-promoted so the decision reaches you instead of a",
                  "failed run. Failed checks:",
                  "",
                  "```",
                  failures,
                  "```",
                  "",
                  "Merge = publish it anyway. Close = skip the day.",
                  "",
              ]

          body = "\n".join(forced_block + [
              "## What changes in tomorrow's issue",
              "",
              f"Issue #{issue_num} for {date} (automated nightly build): "
              f"pulse={pulse_count}, {section_counts}.",
              "",
              f"**📖 Preview the rendered issue:** {preview}",
              "",
              "## Operating this PR",
              "",
              "- **Merge** — publishes this issue to aivector.day.",
              "- **Close** — skips today; nothing is burned, the previous issue "
              "stays live.",
              "- **Comment `/revise`** — applies the editor's text-edit fixes to "
              "this branch (add `only major` to limit it to major and blocking "
              "findings, or `/revise <instruction>` for a targeted edit). The "
              "PR updates in place.",
              "",
              "A \"Proposed revisions (shadow)\" comment below means the fixes "
              "were computed but not applied — `/revise` applies them. A "
              "\"Revisions applied (live)\" comment means the nightly run "
              "already applied them and the review above is of the revised "
              "draft.",
              "",
              "## How we know it's better",
              "",
              "Routine nightly run — no prompt/model change, so no eval gate applies.",
              "Evidence this run produced a publishable issue:",
              "",
              "- `aiv release` staging-integrity gate passed (release_promote refuses otherwise).",
              f"- {verify_line}",
              f"- {review_line}",
              f"- {dedup_line}",
              "",
              "## Gate (shadow)",
              "",
              "Shadow phase: the unattended-publish gate below is computed for",
              "observation only. This did NOT affect publication — merge remains",
              "the decision.",
              "",
              "```",
              *gate_lines,
              "```",
              "",
              "## If it's wrong",
              "",
              "Don't merge — the previous issue stays live on aivector.day; close the",
              f"PR and nothing is burned. If already merged: `aiv unrelease --date {date}`",
              "on a branch cut from main, then revert this PR's commit.",
          ])
          Path("pr_body.md").write_text(body + "\n")
          PY

      - name: Commit release branch
        run: |
          DATE="${{ steps.when.outputs.date }}"
          ISSUE_NUM="${{ steps.ids.outputs.issue_num }}"
          BRANCH="${{ steps.ids.outputs.branch }}"
          if find "data/released/${DATE}" -name '*.tmp' | grep -q .; then
            echo "::error::Stale .tmp file in data/released/${DATE} — atomic write did not complete."
            exit 1
          fi
          git config user.name "aivector-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- "data/released/${DATE}" data/published_urls.txt \
            data/metrics_log.jsonl docs/index.html "docs/released/${DATE}.html" \
            docs/how-its-made.html docs/about.html
          if git diff --cached --quiet; then
            echo "::error::Nothing to commit — release produced no file changes."
            exit 1
          fi
          git commit -m "chore(release): publish ${DATE} as #${ISSUE_NUM}"
          git push origin "$BRANCH"

      - name: Open release PR
        id: open_pr
        run: |
          TITLE="chore(release): publish ${{ steps.when.outputs.date }} as #${{ steps.ids.outputs.issue_num }}"
          if [ "${{ steps.release.outputs.forced }}" = "true" ]; then
            TITLE="[THIN] $TITLE"
          fi
          PR_URL=$(gh pr create --repo "${{ github.repository }}" \
            --base main --head "${{ steps.ids.outputs.branch }}" \
            --title "$TITLE" \
            --body-file pr_body.md)
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      # Morning email: subject carries the gate's shadow verdict so the day
      # is triageable from the inbox. Plain smtplib — no third-party mail
      # action ever sees the credential. Skips quietly (never fails the run)
      # when MAIL_APP_PASSWORD is unset.
      - name: Email PR-ready notification
        env:
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: a.abrahamyan@gmail.com
          PR_URL: ${{ steps.open_pr.outputs.url }}
          RELEASE_FORCED: ${{ steps.release.outputs.forced }}
          ISSUE_NUM: ${{ steps.ids.outputs.issue_num }}
          DATE: ${{ steps.when.outputs.date }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from pathlib import Path

          password = os.environ.get("MAIL_APP_PASSWORD", "")
          if not password:
              print("MAIL_APP_PASSWORD not set -- skipping email notification.")
              raise SystemExit(0)

          date = os.environ["DATE"]
          issue_num = os.environ["ISSUE_NUM"]
          pr_url = os.environ["PR_URL"]
          to_addr = os.environ["MAIL_TO"]

          gate_lines = "gate output unavailable"
          gate_file = Path("gate_output.txt")
          if gate_file.exists():
              gate_lines = gate_file.read_text().strip()
          gate_first = gate_lines.splitlines()[0] if gate_lines else "?"

          preview = (
              f"https://raw.githack.com/{os.environ.get('GITHUB_REPOSITORY', '')}"
              f"/release/{date}-issue-{issue_num}/docs/released/{date}.html"
          )

          msg = EmailMessage()
          forced = os.environ.get("RELEASE_FORCED") == "true"
          prefix = "[THIN] " if forced else ""
          msg["Subject"] = f"{prefix}AI Vector #{issue_num} ({date}) ready -- {gate_first}"
          msg["From"] = to_addr
          msg["To"] = to_addr
          msg.set_content(
              f"Issue #{issue_num} for {date} is built and waiting.\n\n"
              f"Preview:  {preview}\n"
              f"PR:       {pr_url}\n\n"
              f"Gate (shadow):\n{gate_lines}\n\n"
              "Merge = publish. Close = skip. Comment /revise <instruction> = fix.\n"
          )

          try:
              with smtplib.SMTP_SSL(
                  "smtp.gmail.com", 465, context=ssl.create_default_context(), timeout=30
              ) as server:
                  server.login(to_addr, password)
                  server.send_message(msg)
              print("notification email sent.")
          except Exception as exc:  # never fail the publish flow over email
              print(f"email send failed (non-fatal): {exc}")
          PY

      # The editor's review is staging-only (gitignored, dies with the
      # runner), but ratification needs it — post it on the PR in full.
      - name: Post editor review on PR
        run: |
          DATE="${{ steps.when.outputs.date }}"
          REVIEW="data/staging/${DATE}/review.md"
          if [ ! -f "$REVIEW" ]; then
            echo "::warning::No review.md in staging — PR opened without an editor review comment."
            exit 0
          fi
          python - "$REVIEW" <<'PY'
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text()
          if raw.startswith("---"):
              raw = raw[raw.index("---", 3) + 3 :].lstrip()
          Path("review_comment.md").write_text(raw)
          PY
          gh pr comment "${{ steps.ids.outputs.branch }}" \
            --repo "${{ github.repository }}" --body-file review_comment.md

      # Posted here (not right after the gate step) because a PR comment
      # needs an open PR to attach to -- the body was already built above,
      # right after the run that produced revisions.jsonl.
      - name: Post revisions comment on PR
        if: steps.revisions.outputs.has_comment == 'true'
        run: |
          gh pr comment "${{ steps.ids.outputs.branch }}" \
            --repo "${{ github.repository }}" --body-file revisions_comment.md

      # A silent overnight failure is unacceptable: preserve the evidence and
      # make noise. Staging artifacts carry the partial pipeline output.
      - name: Upload staging artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: staging-${{ steps.when.outputs.date || 'unknown-date' }}
          path: |
            docs/staging/
            data/staging/
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "Daily pipeline failure in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "Another nightly run failed: $RUN_URL"
          else
            NEW_URL=$(gh issue create --repo "${{ github.repository }}" \
              --title "Daily pipeline failure" \
              --body "The nightly AI Vector publish workflow failed.

          Run: $RUN_URL
          Staging artifacts (if any) are attached to the run for 7 days.

          No reader-facing outage: the previous issue stays live on aivector.day until a run succeeds.")
            gh issue pin "$NEW_URL" --repo "${{ github.repository }}" || true
          fi
