# Dependabot: proposes version bumps as PRs; nothing updates silently.
# CI installs are pinned by constraints.txt, so a bump only reaches the
# nightly runner when a Dependabot PR (or a manual regeneration) is merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # The 19 CUDA packages torch pulls on Linux move together and are never
    # reviewed individually. Grouped, they arrive as one PR instead of
    # swallowing the 5-PR budget and crowding out bumps that need reading.
    groups:
      torch-cuda-stack:
        patterns:
          - "cuda-*"
          - "nvidia-*"
          - "triton"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
