# Dependabot: proposes version bumps as PRs; nothing updates silently.
# CI installs are pinned by constraints.txt, so a bump only reaches the
# nightly runner when a Dependabot PR (or a manual regeneration) is merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
    # One grouped PR a month. Per-package PRs against a frozen constraints
    # file break in lockstep pairs (boto3+botocore+s3transfer,
    # trafilatura+courlan+htmldate) -- grouped, those move together and the
    # PR resolves. Verification is unchanged: clean-venv install + full
    # suite before merge.
    groups:
      all-pip:
        patterns:
          - "*"
    # torch pins its CUDA stack exactly (cuda-toolkit==, cudnn==, nccl==,
    # triton== ...), so these packages can only move when torch itself moves.
    # A standalone bump makes pip resolution fail on the runner (PR #33).
    # When a torch bump arrives, regenerate the whole freeze instead.
    ignore:
      - dependency-name: "cuda-*"
      - dependency-name: "nvidia-*"
      - dependency-name: "triton"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
