<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    The AI Vector mark - "The Open Block". Ratified 2026-08-09 (see
    docs/internal/brand/DECISION-0001-mark.md).

    THIS FILE IS THE SINGLE SOURCE OF TRUTH for the mark. Every derivative
    regenerates from this path and is never hand-drawn:
      * docs/favicon.svg          - same path, explicit fill + dark-mode query,
                                    because currentColor cannot inherit into a
                                    favicon (it renders as its own document).
      * templates/_mark.svg.j2    - the in-page copy included by the issue and
                                    index templates.
      * tools/brand_marks.py      - the generator that produced the geometry.

    fill-rule="evenodd" is load-bearing. It is what makes the second subpath a
    hole rather than a second block of ink; without it the counterform V fills
    solid and the mark becomes a plain square.

    fill="currentColor" is for in-page use, so the mark inherits the ink colour
    from its container. The accent is never applied to the mark - it stays
    spent on the wordmark slash.
  -->
  <path fill-rule="evenodd" fill="currentColor"
        d="M0 0L100 0L100 100L0 100ZM18.37 0L36.37 84.7L100 16.46L100 0L93.47 0L45.63 51.3L34.72 0Z"/>
</svg>
