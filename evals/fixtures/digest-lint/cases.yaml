# evals/fixtures/digest-lint/cases.yaml -- Eval 11 labelled synthetic cases
#
# STATUS: PROPOSAL (2026-08-09), pending ratification alongside the Eval 11
# thresholds in run_evals.py (digest budget 100 words; bold lead band 3-6
# words; one sentence per bullet, 8-30 words proposal band; synthesis band
# 20-60 words proposal; take-route cap 40%/issue; EDITORIAL.md banned-phrase
# list; bullet-one pulse provenance; verify-verdict bar).
#
# The digest ("The 30-second read", Issue v8) and the section synthesis
# (IssueSection v4) are the 2026-08-09 layout redesign's new reader-facing
# text surfaces. These cases seed each deterministic failure mode plus the
# clean shape that must NOT flag. Consumed by
# evals/test_digest_synthesis_lint.py; each violation case is a mutation
# that proves its check load-bearing (remove the check, the case goes
# green -- the case note names the mutation).
#
# NOT auto-run by the dataset loop: this directory carries no issue.json
# (same pattern as fixtures/take-drift/).

schema_version: 1

cases:

  - id: clean_redesign_issue
    note: >
      The healthy shape: 3 bullets inside every band (59 total words,
      leads 4 words, sentences 15-16 words, one sentence each), bullet 1
      carries the Pulse story, no collisions, no banned phrases,
      syntheses inside the 20-60 proposal band, routes spread 2/2/1
      (40% is NOT a violation -- the rule is strictly greater). Must stay
      clean; ANY threshold tightening flips this case red first.
    expect_violation_kinds: []
    expect_seams:
      take_routes: exposed
    issue:
      date: "2026-08-09"
      pulse:
        name: pulse
        stories:
          - story_id: "c_aaaaaaaaaaaa"
            headline: "Coding agents move onto the laptop"
            summary: "A packaged runtime moves the whole loop local."
            take: "Local agent runtimes just became the default assumption for pilots."
            take_route: "displacement"
      sections:
        - name: big_picture
          synthesis: >-
            Three of today's four stories move agent oversight into the
            runtime, with regulators, vendors, and one open toolchain
            converging on inspection points that live inside the loop.
          stories:
            - story_id: "c_bbbbbbbbbbbb"
              headline: "Model risk teams widen the audit scope"
              summary: "Sign-off now covers plans and tool calls."
              take: "Model-risk sign-off now covers agent plans, not just model outputs."
              take_route: "displacement"
            - story_id: "c_cccccccccccc"
              headline: "Two vendors trade accuracy for latency"
              summary: "Halved response times for one benchmark point."
              take: "Production buyers now price latency above the leaderboard point it costs."
              take_route: "consequence"
        - name: hands_on
          synthesis: >-
            Both practical items today assume you already run an agent
            loop in production, and both reward teams that wired their
            own latency and incident baselines months ago.
          stories:
            - story_id: "c_dddddddddddd"
              headline: "A local runtime ships with sandbox defaults"
              summary: "Clone it and run the loop offline."
              take: "The sandbox default, not the model, is what unlocks laptop pilots."
              take_route: "consequence"
            - story_id: "c_eeeeeeeeeeee"
              headline: "An eval harness adds latency budgets"
              summary: "Budgets fail the suite when responses slow."
              take: "Latency budgets just became a first-class eval assertion."
              take_route: "reframe"
      digest:
        - lead: "Agents run locally now"
          sentence: >-
            A packaged runtime moves coding agents onto laptops with no
            cloud dependency for the common loop.
          story_ids: ["c_aaaaaaaaaaaa"]
        - lead: "Audit scope widens quickly"
          sentence: >-
            Model risk sign-off now covers agent plans and tool calls,
            not just model outputs.
          story_ids: ["c_bbbbbbbbbbbb"]
        - lead: "Latency beats accuracy today"
          sentence: >-
            Two vendor releases trade a point of benchmark accuracy for
            halved response times in production loops.
          story_ids: ["c_cccccccccccc", "c_eeeeeeeeeeee"]

  - id: budget_and_bands_violations
    note: >
      Four seeded band defects on one issue: a 2-word lead (under band),
      a 7-word lead (over band), a two-sentence bullet, and enough
      padding to blow the 100-word budget. Mutation targets: drop the
      lead band and both digest_lead_band rows go green; drop the
      one-sentence rule and digest_multi_sentence goes green; raise the
      budget above 103 and digest_budget goes green. digest_sentence_band
      fires on the 35-word run-on sentence (proposal band 8-30).
    expect_violation_kinds:
      - digest_lead_band
      - digest_lead_band
      - digest_multi_sentence
      - digest_sentence_band
      - digest_budget
    issue:
      date: "2026-08-09"
      pulse:
        name: pulse
        stories:
          - story_id: "c_aaaaaaaaaaaa"
            headline: "Coding agents move onto the laptop"
            summary: "A packaged runtime moves the whole loop local."
      sections: []
      digest:
        - lead: "Agents local"
          sentence: >-
            A packaged runtime moves coding agents onto laptops with no
            cloud dependency for the common loop of everyday work across
            the whole team and its weekly release cadence.
          story_ids: ["c_aaaaaaaaaaaa"]
        - lead: "Audit scope widens very much more quickly"
          sentence: >-
            Model risk sign-off now covers agent plans and tool calls
            rather than just model outputs. Boards are reorganising their
            review committees around that shift this quarter.
          story_ids: ["c_aaaaaaaaaaaa"]
        - lead: "Latency beats accuracy today"
